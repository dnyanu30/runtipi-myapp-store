services:
  freefilesync-d:
    image: jlesage/freefilesync:v26
    restart: unless-stopped
    volumes:
      - /home/dnyanu30/runtipi/app-data/dstore/freefilesync-d:/config:rw
      - /opt/appdata/immich-gallary:/Source:r
      - /mnt/SSD1:Destination:rw
    environment:
      - TZ=America/New_York
      - WEB_FILE_MANAGER=1
      - DARK_MODE=1
    x-runtipi:
      is_main: true
      internal_port: 5800

x-runtipi:
  schema_version: 2